name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vaak
        run: |
          curl -fsSL -o vaak.cjs \
            https://github.com/chandru89new/vaak/releases/latest/download/vaak.cjs
          chmod +x vaak.cjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build site
        env:
          SITE_NAME: "notes / druchan"
          SITE_URL: https://notes.druchan.com
        run: ./vaak.cjs build

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > "$RUNNER_TEMP/gcp-key.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: firebase deploy --non-interactive
